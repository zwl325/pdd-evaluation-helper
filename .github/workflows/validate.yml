name: Validate userscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check pdd-evaluation-filter.user.js
          node --check scripts/sync-metadata.cjs
          node --check tests/filter-helper.spec.cjs
          node --check tests/batch-workflow.spec.cjs
          node --check tests/report-workflow.spec.cjs
          node --check tests/record-time.spec.cjs
          node --check tests/report-counter-templates.spec.cjs
          node --check tests/report-acceptance.spec.cjs
          node --check tests/pagination.spec.cjs
          node --check tests/metadata.spec.cjs
      - name: Check version and update metadata
        run: node scripts/sync-metadata.cjs --check
      - name: Verify release version tooling
        run: node tests/metadata.spec.cjs
