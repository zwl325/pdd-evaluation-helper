name: Validate userscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check pdd-evaluation-filter.user.js
          node --check scripts/sync-metadata.cjs
          node --check tests/filter-helper.spec.cjs
      - name: Check version and update metadata
        run: node scripts/sync-metadata.cjs --check
